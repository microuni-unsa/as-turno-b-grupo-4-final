services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pims}
      POSTGRES_DB: ${POSTGRES_DB:-pims_evidence}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pims} -d ${POSTGRES_DB:-pims_evidence}"]
      interval: 5s
      timeout: 5s
      retries: 20

  presidio:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/cricro/pims-final}/presidio-analyzer:2.2.x-es
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/cricro/pims-final}/app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EVIDENCE_DB_URL: postgres://${POSTGRES_USER:-pims}:${POSTGRES_PASSWORD:-pims}@db:5432/${POSTGRES_DB:-pims_evidence}
      PRESIDIO_URL: http://presidio:3000
      DEPLOY_PORT: "8080"
      DEPLOY_DATA_DIR: /app/data
      HOME: /tmp
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - app_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      presidio:
        condition: service_healthy

volumes:
  pgdata:
  app_data:
